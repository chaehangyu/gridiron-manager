[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-manager"
version = "0.1.0"
description = "Football Manager 스타일 NFL 매니지먼트 시뮬레이션"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
data = ["nflreadpy>=0.1.5", "polars>=1.0", "pandas>=2", "pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
gridiron = "gridiron.cli:main"

[tool.setuptools.packages.find]
include = ["gridiron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
