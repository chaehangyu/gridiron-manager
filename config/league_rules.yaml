# 리그 규칙과 경기 엔진 보정 계수 (PRD F1-7, N4)
roster:
  active_max: 53
  gameday_active: 48
  practice_squad: 16
  practice_squad_elevations_per_game: 2
  elevations_per_player_season: 3
ir:
  min_games: 4
  return_designations: 8

game:
  quarter_length: 15.0
  num_periods: 4
  overtime_length: 10.0          # 2025년부터 정규시즌 연장 10분, 양 팀 모두 공격권
  overtime_length_playoffs: 15.0
  overtime_type: bothPossess
  overtime_type_playoffs: bothPossess
  max_overtimes: 1               # 정규시즌 무승부 허용
  max_overtimes_playoffs: 99
  timeouts_per_half: 3
  timeouts_overtime: 2
  scrimmage_touchback_kickoff: 35  # 2025년 킥오프 터치백 35야드
  two_point_conversions: true
  home_advantage_pct: 1.0
  base_injury_rate: 0.0008
  # 임시 결과 모델(FbgmOutcome) 보정. 샘플 리그 500경기 기준으로 PRD §8.4 범위에 맞췄다.
  # M2 실데이터 결과 모델로 바뀌면 다시 1.0에서 시작한다.
  sack_factor: 0.85
  completion_factor: 1.03
  fg_accuracy_factor: 1.09
  rush_yds_factor: 0.97
