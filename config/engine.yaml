# 실측 결과 모델(DataOutcome) 파라미터 — ENGINE_DESIGN §5, §9
# 능력치 차이 Δ = 공격 유닛 − 수비 유닛 (포지션별 주전 평균·표준편차 기준 표준점수).
# 계수는 "주전 표준편차 1만큼 차이"당 효과이며, M3에서 2025 재현 테스트로 적합한다 (초기값).
# 모든 β에 곱하는 배율. 2025 재현 테스트(tools/reproduce_season.py)에서 팀 득실차 분산이 실제와 같아지는 값으로 적합 (M3·M4 모두 1.25).
beta_scale: 1.25
beta:
  pressure: 0.30        # 패스 러시 vs 패스 블록 → 압박 로짓
  sack: 0.30            # 압박 시 QB 포켓 감각·회피 → 색 로짓 (음수 방향)
  scramble: 0.35        # QB 기동력 → 스크램블 로짓
  completion: 0.25      # QB 정확도 + 리시버 vs 커버리지 → 완성 로짓
  interception: 0.25    # QB 판단력 vs 볼 스킬 → INT 로짓 (음수 방향)
  air: 0.10             # 에어 야드 분위수
  yac: 0.25             # 캐치 후 야드 분위수
  run: 0.25             # 런 야드 분위수
  scramble_yards: 0.20
  kick: 0.12            # 킥 정확도 1점당 FG 로짓
  returns: 0.15         # 리턴 야드 분위수
home_advantage: 0.03     # 홈 공격 분위수·로짓 보정
fumble_per_touch: 0.0065 # 터치당 펌블 (절반은 공격이 회복)
# 의도한 깊이 → 실제 던진 깊이 기본 전환 (체크다운 포함). 여기에 커버리지·압박 비율(실측)을 곱한다.
intent_to_depth:
  screen: {screen: 1.0}
  quick: {quick: 0.9, inter: 0.1}
  inter: {quick: 0.25, inter: 0.65, deep: 0.10}
  deep: {quick: 0.15, inter: 0.25, deep: 0.60}
depth_ratio_power: 1.8   # 커버리지·압박 깊이 비율 지수 (tools/check_reproduction.py로 실측 E5에 맞춤)
# 4th down·2점 판단 (nfl4th 방식). margin > 0이면 WP 최적보다 보수적.
decisions:
  fourth_down_go_margin: 0.02
  fg_max_distance: 62            # 전·후반 막판(fieldGoalLate)은 별도 규칙
  fg_long_margin: 0.012          # 50야드 이상 FG 선택에 주는 보수성 여유
  two_point_margin: 0.0008        # 실제 감독은 승률 최적보다 2점 시도를 덜 한다
  expected_kickoff_start: 30      # 상대 킥오프 후 평균 시작 위치 (자기 진영, 2025 규칙)
# 평균 매치업 중심 보정: 평균적인 두 팀이 붙을 때 Δ 평균이 0이 되도록 뺀다.
# (필드에는 주전이 백업보다 자주 서고, 타깃은 좋은 리시버에게 몰린다 — 실측 분포에 이미 들어 있는 선택 효과)
# 측정: python tools/calibrate_centers.py 400 real:2026  (능력치를 다시 산출하면 다시 잰다)
center:
  rush: 0.037
  pass: 0.122
  int: -0.429
  yac: 0.08
  pocket: 0.017
  mobility: -0.026
  run: 0.012
  scramble: 0.276
# 가상 샘플 리그(임시 생성 능력치)용: python tools/calibrate_centers.py 400 sample
center_sample:
  rush: 0.297
  pass: 0.153
  int: -0.298
  yac: 0.297
  pocket: -0.01
  mobility: -0.037
  run: 0.178
  scramble: 0.102
# 경기 중 학습 코디네이터 (ENGINE_DESIGN §6, M4). 단위: 기대 EPA(fit_*), Δ(gamma_*), 로짓(delta_obvious, kind_box_k)
coordinator:
  kappa: 20             # 사전 믿음 강도 (가상 플레이 수). 상대 분석 훈련으로 ×1.5
  tau: 0.02             # 대응 정밀도 (EPA). AI 코디네이터는 팀별 0.01–0.04
  fit_cov: 0.02         # 우리 커버리지 유닛이 맨/존에 맞는 정도(표준점수 1)당 콜 가치
  fit_blitz: 0.015      # 블리처 패스 러시 표준점수 1당 블리츠 가치
  fit_off: 0.02         # QB·리시버 깊이별 능력 표준점수 1당 패스 패밀리 가치
  fit_floor: 0.15       # 대응 강도 0이어도 로스터 궁합에 따른 콜 조정은 이 강도로 남긴다
  kind_box_k: 1.5       # 상대가 무거운 박스를 쓰는 정도 → 패스 확률 로짓
  box_k: 1.0            # 런 예상 정도 → 박스를 한 단계 무겁게 할 확률
  gamma_pass: 2.3       # 읽힘 효과: 패스 믿음 초과분 1당 패스 Δ 감소 (Δ 1 ≈ 패스 EPA 0.13 → 설계값 0.30 EPA)
  gamma_run: 0.15       # 런은 읽혀도 손해가 작다 (E9)
  read_threshold: 0.08  # 믿음이 중립보다 이만큼 넘게 치우친 부분에만 읽힘 효과 (G3: 최적 혼합이 극단으로 가지 않게)
  delta_obvious: 3.0    # 뻔한 패스 상황(믿음 0.8 초과분) 압박 로짓 가산 (E9b)
  bust_base: 0.03       # 숙련도 40일 때 커버리지 붕괴 확률
  bust_size: 2.0        # 붕괴 시 패스 Δ 가산
# 상황별 결과 보정 (M4). 실측 EPA(엔진과 같은 EP 모델)에 맞춘 이동값.
#  pass: 다운·거리 → 에어·YAC 분위수 / pass_gs: 점수·시간(close 기준 0) / pass_fz: 필드 구역(opp 기준 0) / run: 다운·거리 → 런 야드
# 측정: python tools/calibrate_situations.py 4 1600  (실제 2026 리그 기준. 기준 분포·능력치·중심값을 바꾸면 다시 잰다)
situation_shift:
  pass: {}
  pass_gs: {"lead": 0.051, "trail": -0.096, "two_min": -0.103}
  pass_fz: {"goal": -0.07, "red": 0.283}
  run: {"1st": -0.054, "2l": -0.075, "2m": -0.075, "2s": -0.03, "3l": -0.022, "3m": -0.093, "3s": -0.192}

# 선수 사용량 분배 (M7c, tools/check_usage.py로 실측 점유율에 맞춤)
usage:
  target_skill: 0.4     # 타깃 선택 가중치 exp(k · 리시버 능력 z) — 클수록 에이스에 몰림 (실측 1번 타깃 점유율 ≈0.25)
  rb2_share: 0.2        # 런에서 뎁스차트 RB2가 공을 받는 비율 (필드 위 여부와 무관, 로테이션 — 실측 RB1 캐리 ≈0.55)
  rb3_share: 0.03

# 그날 경기력 (M7c, tools/check_variance.py로 같은 매치업 득실차 잔차 SD를 실측 ≈13.4에 맞춤)
game_form:
  sd: 0.09             # 팀 공격·수비 효율 이동 표준편차 (홈 이점 0.03과 같은 단위)
  consistency_k: 0.04  # 주전 평균 '일관성' 1점당 변동 배율 exp(−k·(c−10.5))

# 패스 효율 수준 (M7c). 실측 2023–2025: Y/A 7.0, 완성률 64.4%, INT 2.2%, 색 6.9%, 득점 22.5.
# 엔진 드롭백 EPA가 실측보다 ≈0.06 낮았다(T1). 야드는 이미 실측 수준이라 INT를 줄이고 완성·YAC는 조금만 올린다.
pass_level: 0.03     # 완성 로짓·YAC 분위수 이동
int_factor: 0.88     # 인터셉션 확률 배율
